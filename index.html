<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Звонки</title>
    <style>
        body { background: #0c0c1e; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .control-panel { display: flex; gap: 15px; justify-content: center; margin-bottom: 10px; }
        .video-grid { display: flex; gap: 25px; justify-content: center; flex-wrap: wrap; }
        .video-box { background: #141432; padding: 10px; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 204, 255, 0.1); }
        video { width: 440px; height: 330px; background: #000; border-radius: 8px; border: 2px solid #00ccff; object-fit: cover; }
        button { padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
        #shareScreenBtn { background: #ffcc00; color: black; }
        #shareScreenBtn:hover { background: #ffee33; box-shadow: 0 0 15px #ffcc00; }
        #startCallBtn { background: #00ccff; color: black; }
        #startCallBtn:hover { background: #00ffcc; box-shadow: 0 0 15px #00ffcc; }
        .key-area { background: #171738; padding: 15px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
        textarea { width: 95%; height: 80px; background: #090914; color: #00ffcc; border: 1px solid #334; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 12px; resize: none; }
        h1 { font-size: 36px; color: #00ccff; text-shadow: 0 0 15px rgba(0, 204, 255, 0.4); }
        h3 { margin: 5px 0 10px 0; color: #a0a0d0; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Звонки</h1>
        
        <div class="control-panel">
            <button id="shareScreenBtn" onclick="startScreenShare()">1. Включить экран и микрофон 🎥</button>
            <button id="startCallBtn" onclick="createOffer()">2. Создать код приглашения ⚡</button>
        </div>

        <div class="video-grid">
            <div class="video-box">
                <h3>Вы</h3>
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            <div class="video-box">
                <h3>Собеседник</h3>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>

        <!-- ОКОШКО ДЛЯ ОБМЕНА КЛЮЧАМИ СВЯЗИ -->
        <div class="key-area">
            <h3 id="statusText">Поле для обмена кодами связи:</h3>
            <textarea id="keyExchangeArea" placeholder="Здесь появится ваш код, или сюда нужно вставить код от друга..."></textarea>
            <button id="actionBtn" onclick="applyReceivedKey()" style="background: #00ffcc; color: black;">3. Принять код друга</button>
        </div>
    </div>

    <script>
        let localStream = null;
        let peerConnection = null;
        
        // Чистый STUN-сервер Google без лишних слешей
        const config = { iceServers: [{ urls: "stun:://google.com" }] };

        // Захват экрана и звука
        async function startScreenShare() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                localStream = new MediaStream([
                    ...screenStream.getVideoTracks(),
                    ...audioStream.getAudioTracks()
                ]);

                document.getElementById('localVideo').srcObject = localStream;
                console.log("Экран и микрофон успешно готовы!");
                document.getElementById('statusText').innerText = "Шаг 1 готов! Нажмите кнопку 2.";
            } catch (e) {
                console.error("Ошибка захвата медиа:", e);
            }
        }

        // Базовая настройка WebRTC
        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(config);

            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                document.getElementById('statusText').innerText = "🎉 Соединение успешно установлено!";
            };

            // Собираем сетевые маршруты в один текстовый ключ
            peerConnection.onicecandidate = (event) => {
                if (!event.candidate) {
                    // Когда всё собралось, выводим финальный ключ в текстовое поле
                    document.getElementById('keyExchangeArea').value = btoa(JSON.stringify(peerConnection.localDescription));
                }
            };
        }

        // Инициатор звонка создает Предложение (Offer)
        async function createOffer() {
            createPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            document.getElementById('statusText').innerText = "⏳ Генерирую код... Скопируйте его и отправьте другу!";
        }

        // Применение кода, который вставили в текстовое поле
        async function applyReceivedKey() {
            const text = document.getElementById('keyExchangeArea').value.trim();
            if (!text) return alert("Поле пустое! Вставьте код.");

            const data = JSON.parse(atob(text));

            if (!peerConnection) {
                // Если мы принимаем звонок (Ответ на Offer)
                createPeerConnection();
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                document.getElementById('statusText').innerText = "✅ Ответ создан! Скопируйте текст из поля ниже и отправьте первому человеку.";
            } else {
                // Если мы начали звонок и получили Ответ (Answer) от друга
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
            }
        }
    </script>
</body>
</html>
